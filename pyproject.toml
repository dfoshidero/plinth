[project]
name = "universal-project-template"
version = "0.1.0"
description = "Generates local, ready-to-push application and GitOps repositories from one config."
requires-python = ">=3.12"
dependencies = [
	"jinja2>=3.1,<4",
	"pydantic==2.14.1",
	"pyyaml>=6.0,<7",
	"questionary>=2.1,<3",
]

[project.scripts]
scaffold = "templater.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["templater"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
